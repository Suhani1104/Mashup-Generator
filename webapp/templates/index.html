<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mashup Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <div class="background-shapes">
        <div class="shape shape-1"></div>
        <div class="shape shape-2"></div>
    </div>

    <div class="glass-card">
        <div class="header">
            <h1><i class="fas fa-headphones-simple gradient-icon"></i> Mashup Generator</h1>
            <p>Remix your favorite singer's songs instantly</p>
        </div>

        {% if error %}
            <div class="status-msg error">
                <i class="fas fa-exclamation-circle"></i> {{ error }}
            </div>
        {% endif %}

        {% if success %}
            <div class="status-msg success">
                <i class="fas fa-check-circle"></i> {{ success }}
            </div>
        {% endif %}

        <form method="POST">
            <div class="input-wrapper">
                <i class="fas fa-microphone-lines icon"></i>
                <input type="text" name="singer" placeholder="Singer Name" required>
            </div>

            <div class="input-wrapper">
                <i class="fas fa-compact-disc icon"></i>
                <input type="number" name="videos" placeholder="Number of Videos (>10)" required>
            </div>

            <div class="input-wrapper">
                <i class="fas fa-bolt icon"></i>
                <input type="number" name="duration" placeholder="Duration (>20 sec)" required>
            </div>

            <div class="input-wrapper">
                <i class="fas fa-paper-plane icon"></i>
                <input type="email" name="email" placeholder="Email ID" required>
            </div>

            <button type="submit">CREATE MASHUP</button>
        </form>
    </div>

</body>
</html>
